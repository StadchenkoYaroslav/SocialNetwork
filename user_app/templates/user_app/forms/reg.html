{% load static %}
<form method="post" id="registerForm" class="opened-form">
    <div class="row">
        <h1 class="active">Реєстрація</h1>
        <h1 id="openLogin">Авторизація</h1>
    </div>
    <h4>Приєднуйся до World IT</h4>

    <div class="form-content">
        {% csrf_token %}
        <label>
            <p>Електронна пошта</p>
            <input type="email" name="email" placeholder="you@example.com" required>
        </label>

        <label>
            <p>Пароль</p>
            <div class="password-container">
                <input type="password" name="password" placeholder="Введи пароль" required>
                <img src="{% static 'user_app/images/eye.png' %}" alt="Показати пароль" class="eye-icon">
            </div>    
        </label>
        
        <label>
            <p>Підтверди пароль</p>
            <div class="password-container">
                <input type="password" name="confirm_password" placeholder="Повтори пароль" required>
                <img src="{% static 'user_app/images/eye.png' %}" alt="Показати пароль" class="eye-icon">
            </div>
        </label>
        
        
        
    </div>
    <button type="submit">Створити акаунт</button>
</form>


{% load static %}
<form method="post" id="loginForm">
    <div class="row">
        <h1 id="openRegister">Реєстрація</h1>
        <h1 class="active">Авторизація</h1>
    </div>
    <h4>Раді тебе знову бачити!</h4>

    <div class="form-content">
        {% csrf_token %}
        <label>
            <p>Електронна пошта</p>
            <input type="email" name="email" placeholder="you@example.com" required>
        </label>

        <label>
            <p>Пароль</p>
            <div class="password-container">
                <input type="password" name="password" placeholder="Введи пароль" required>
                <img src="{% static 'user_app/images/eye.png' %}" alt="Показати пароль" class="eye-icon">
            </div> 
        </label>
    </div>
    <button type="submit">Увійти</button>
</form>
